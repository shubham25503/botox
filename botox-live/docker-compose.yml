version: '3.8'

services:
  botox-live:
    build: .
    ports:
      - "8003:8003"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - .:/app
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped 