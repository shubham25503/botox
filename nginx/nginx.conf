events {}

http {
    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name 108.181.152.249 juneplex.com www.juneplex.com;

        # SSL Validation route (for certbot or RapidSSL)
        location /.well-known/pki-validation/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name juneplex.com www.juneplex.com;

        client_max_body_size 50M;

        # ssl_certificate /etc/ssl/cert/juneplex.com.crt;
        ssl_certificate /etc/ssl/cert/fullchain.pem;
        ssl_certificate_key /etc/ssl/private/juneplex.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline';
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com data:;
            img-src 'self' data:;
            connect-src 'self' https://juneplex.com wss://juneplex.com;
        " always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Serve static frontend files
        location / {
            proxy_pass http://botox-frontend:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy API requests to the backend
        location /api/ {
            proxy_pass http://botox-backend:8000/api/;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy image generation requests to Stable Diffusion
        location /generate/ {
            proxy_pass http://stable-diffusion:8888/generate/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket proxying for botox-backend
        location /ws/stream {
            proxy_pass http://botox-backend:8000/ws/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /ws/cursor {
            proxy_pass http://botox-backend:8000/ws/cursor;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # WebSocket proxying for stable-diffusion (merged botox-live)
        # location /ws/stream {
        #     proxy_pass http://stable-diffusion:8888/ws;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host $host;
        #     proxy_read_timeout 86400;
        #     proxy_send_timeout 86400;
        # }
    }
}
